<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  :root {
    --bg: #1a1a2e;
    --accent: #4ecca3;
    --panel: #16213e;
    --food: #e23e57;
    --canvas-bg: #0f0f23;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Segoe UI', sans-serif;
    color: #eee;
  }
  .container { text-align: center; }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .score-box, .best-box {
    font-size: 1.1rem;
    background: var(--panel);
    padding: 8px 18px;
    border-radius: 8px;
  }
  .score-box span, .best-box span {
    color: var(--accent);
    font-weight: bold;
    font-size: 1.3rem;
  }
  canvas {
    border: 3px solid var(--accent);
    border-radius: 4px;
    background: var(--canvas-bg);
    display: block;
  }
  .controls {
    margin-top: 14px;
    color: #888;
    font-size: 0.9rem;
  }
  .controls kbd {
    background: var(--panel);
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #333;
    font-family: inherit;
  }
  .game-over-overlay {
    display: none;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .game-over-overlay.show { display: block; }
  .game-over-overlay h2 {
    font-size: 2rem;
    color: var(--food);
    margin-bottom: 10px;
  }
  .game-over-overlay button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 10px 30px;
    font-size: 1.1rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  .game-over-overlay button:hover { background: #3db88f; }
  .wrapper { position: relative; display: inline-block; }
</style>
</head>
<body>
<div class="container">
  <h1>贪吃蛇</h1>
  <div class="info">
    <div class="score-box">分数 <span id="score">0</span></div>
    <div class="best-box">最高 <span id="best">0</span></div>
  </div>
  <div class="wrapper">
    <canvas id="canvas"></canvas>
    <div class="game-over-overlay" id="overlay">
      <h2>游戏结束</h2>
      <p style="margin-bottom:12px">最终得分: <strong id="finalScore" style="color:var(--accent)">0</strong></p>
      <button onclick="restart()">再来一局</button>
    </div>
  </div>
  <div class="controls">
    <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向 · <kbd>空格</kbd> 暂停/继续
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const $score = document.getElementById('score');
const $best = document.getElementById('best');
const $overlay = document.getElementById('overlay');
const $finalScore = document.getElementById('finalScore');

const GRID = 20;
const COLS = 30;
const ROWS = 20;
const CX = Math.floor(COLS / 2);
const CY = Math.floor(ROWS / 2);
const BEST_KEY = 'snakeBest';

const DIR = {
  UP:    { x: 0, y: -1 },
  DOWN:  { x: 0, y: 1 },
  LEFT:  { x: -1, y: 0 },
  RIGHT: { x: 1, y: 0 },
};

canvas.width = COLS * GRID;
canvas.height = ROWS * GRID;

// Pre-render static grid to offscreen canvas
const gridCanvas = document.createElement('canvas');
gridCanvas.width = canvas.width;
gridCanvas.height = canvas.height;
const gctx = gridCanvas.getContext('2d');
gctx.strokeStyle = '#1a1a2e';
gctx.lineWidth = 0.5;
for (let x = 0; x <= COLS; x++) {
  gctx.beginPath();
  gctx.moveTo(x * GRID, 0);
  gctx.lineTo(x * GRID, canvas.height);
  gctx.stroke();
}
for (let y = 0; y <= ROWS; y++) {
  gctx.beginPath();
  gctx.moveTo(0, y * GRID);
  gctx.lineTo(canvas.width, y * GRID);
  gctx.stroke();
}

let snake, food, score, best, gameLoop, running, paused;
let direction = { ...DIR.RIGHT };
let nextDirection = { ...DIR.RIGHT };

function loadBest() {
  try {
    return parseInt(localStorage.getItem(BEST_KEY), 10) || 0;
  } catch { return 0; }
}

function saveBest(val) {
  try { localStorage.setItem(BEST_KEY, val); } catch {}
}

function init() {
  snake = [
    { x: CX, y: CY },
    { x: CX - 1, y: CY },
    { x: CX - 2, y: CY },
  ];
  direction = { ...DIR.RIGHT };
  nextDirection = { ...DIR.RIGHT };
  score = 0;
  running = true;
  paused = false;
  best = loadBest();
  $score.textContent = '0';
  $best.textContent = best;
  $overlay.classList.remove('show');
  spawnFood();
}

function spawnFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  const free = [];
  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      if (!occupied.has(`${x},${y}`)) free.push({ x, y });
    }
  }
  food = free[Math.floor(Math.random() * free.length)];
}

function drawCircle(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(gridCanvas, 0, 0);

  // Food
  ctx.shadowColor = '#e23e57';
  ctx.shadowBlur = 8;
  drawCircle(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, '#e23e57');
  ctx.shadowBlur = 0;

  // Snake body
  snake.forEach((seg, i) => {
    const ratio = 1 - i / (snake.length + 8);
    const r = Math.floor(78 * ratio);
    const g = Math.floor(204 * ratio + 80 * (1 - ratio));
    const b = Math.floor(163 * ratio + 60 * (1 - ratio));
    const color = `rgb(${r},${g},${b})`;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = i === 0 ? 10 : 0;
    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad * 2, GRID - pad * 2);
  });
  ctx.shadowBlur = 0;

  // Eyes
  const head = snake[0];
  const hx = head.x * GRID, hy = head.y * GRID;
  let ex1, ey1, ex2, ey2;
  if (direction.x === 1)      { ex1 = hx + 13; ey1 = hy + 6;  ex2 = hx + 13; ey2 = hy + 14; }
  else if (direction.x === -1) { ex1 = hx + 7;  ey1 = hy + 6;  ex2 = hx + 7;  ey2 = hy + 14; }
  else if (direction.y === -1) { ex1 = hx + 6;  ey1 = hy + 7;  ex2 = hx + 14; ey2 = hy + 7;  }
  else                         { ex1 = hx + 6;  ey1 = hy + 13; ex2 = hx + 14; ey2 = hy + 13; }

  drawCircle(ex1, ey1, 2.5, '#fff');
  drawCircle(ex2, ey2, 2.5, '#fff');
  drawCircle(ex1, ey1, 1.2, '#111');
  drawCircle(ex2, ey2, 1.2, '#111');
}

function update() {
  if (!running || paused) return;

  direction.x = nextDirection.x;
  direction.y = nextDirection.y;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver();
    return;
  }

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    $score.textContent = score;
    spawnFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  running = false;
  clearInterval(gameLoop);
  $finalScore.textContent = score;
  $overlay.classList.add('show');
  if (score > best) {
    best = score;
    saveBest(best);
    $best.textContent = best;
  }
}

function restart() {
  clearInterval(gameLoop);
  init();
  draw();
  gameLoop = setInterval(tick, 100);
}

function tick() {
  update();
  if (!paused) draw();
}

document.addEventListener('keydown', e => {
  if (!running) return;

  const key = e.key.toLowerCase();

  if (key === ' ' || key === 'spacebar') {
    e.preventDefault();
    paused = !paused;
    return;
  }

  if (paused) return;

  switch (key) {
    case 'arrowup':    case 'w': if (direction.y !== 1)  nextDirection = { ...DIR.UP };    break;
    case 'arrowdown':  case 's': if (direction.y !== -1) nextDirection = { ...DIR.DOWN };  break;
    case 'arrowleft':  case 'a': if (direction.x !== 1)  nextDirection = { ...DIR.LEFT };  break;
    case 'arrowright': case 'd': if (direction.x !== -1) nextDirection = { ...DIR.RIGHT }; break;
  }
});

init();
draw();
gameLoop = setInterval(tick, 100);
</script>
</body>
</html>
