<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game — 测试套件</title>
<style>
  :root {
    --bg: #1a1a2e;
    --accent: #4ecca3;
    --panel: #16213e;
    --fail: #e23e57;
    --warn: #ffb528;
    --pass: #4ecca3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: #eee;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    padding: 30px;
    min-height: 100vh;
  }
  h1 { color: var(--accent); margin-bottom: 4px; font-size: 2rem; }
  .summary {
    display: flex;
    gap: 20px;
    margin: 16px 0 24px;
    flex-wrap: wrap;
  }
  .summary-card {
    background: var(--panel);
    border-radius: 10px;
    padding: 14px 24px;
    min-width: 100px;
    text-align: center;
  }
  .summary-card .num { font-size: 2rem; font-weight: bold; }
  .summary-card .label { font-size: 0.8rem; color: #888; margin-top: 2px; }
  .pass .num { color: var(--pass); }
  .fail .num { color: var(--fail); }
  .suite {
    background: var(--panel);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .suite-header {
    padding: 12px 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 1.05rem;
  }
  .suite-header:hover { opacity: 0.9; }
  .suite-header .status { font-size: 0.85rem; padding: 2px 10px; border-radius: 12px; }
  .suite-body { padding: 0 20px 16px; display: none; }
  .suite-body.open { display: block; }
  .test-case {
    padding: 8px 16px;
    margin: 4px 0;
    border-radius: 6px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .test-case.pass { background: rgba(78,204,163,0.08); }
  .test-case.fail { background: rgba(226,62,87,0.12); }
  .test-case .icon { width: 20px; font-weight: bold; flex-shrink: 0; }
  .test-case .msg { flex: 1; }
  .test-case .detail { font-size: 0.78rem; color: #888; }
  .failed .suite-header { border-left: 3px solid var(--fail); }
  .passed .suite-header { border-left: 3px solid var(--pass); }
</style>
</head>
<body>
<h1>测试套件</h1>
<div class="summary" id="summary"></div>
<div id="suites"></div>

<script>
// ============================================================
// Pure game logic (extracted from snake-game.html for testing)
// ============================================================
const COLS = 30;
const ROWS = 20;
const CX = Math.floor(COLS / 2);
const CY = Math.floor(ROWS / 2);

const DIR = {
  UP:    { x: 0, y: -1 },
  DOWN:  { x: 0, y: 1 },
  LEFT:  { x: -1, y: 0 },
  RIGHT: { x: 1, y: 0 },
};

function createInitSnake() {
  return [
    { x: CX, y: CY },
    { x: CX - 1, y: CY },
    { x: CX - 2, y: CY },
  ];
}

function spawnFood(snake) {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  const free = [];
  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      if (!occupied.has(`${x},${y}`)) free.push({ x, y });
    }
  }
  return free[Math.floor(Math.random() * free.length)];
}

function updateSnake(snake, direction, food) {
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
  const ate = head.x === food.x && head.y === food.y;
  const newSnake = [head, ...snake];
  if (!ate) newSnake.pop();
  return { snake: newSnake, ate };
}

function checkWallCollision(head) {
  return head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
}

function checkSelfCollision(snake, head) {
  return snake.some(s => s.x === head.x && s.y === head.y);
}

function canChangeDirection(current, next) {
  return current.x !== -next.x || current.y !== -next.y;
}

function getSnakeColor(i, length) {
  const ratio = 1 - i / (length + 8);
  const r = Math.floor(78 * ratio);
  const g = Math.floor(204 * ratio + 80 * (1 - ratio));
  const b = Math.floor(163 * ratio + 60 * (1 - ratio));
  return `rgb(${r},${g},${b})`;
}

// ============================================================
// Test framework
// ============================================================
const suites = [];
let currentSuite = null;
let totalPass = 0, totalFail = 0;

function describe(name, fn) {
  currentSuite = { name, tests: [], passed: 0, failed: 0 };
  suites.push(currentSuite);
  fn();
  currentSuite = null;
}

function it(name, fn) {
  try {
    fn();
    currentSuite.tests.push({ name, status: 'pass' });
    currentSuite.passed++;
    totalPass++;
  } catch (e) {
    currentSuite.tests.push({ name, status: 'fail', error: e.message });
    currentSuite.failed++;
    totalFail++;
  }
}

function assertEqual(actual, expected, msg) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error(msg || `expected ${e}, got ${a}`);
}

function assertTrue(val, msg) {
  if (!val) throw new Error(msg || 'expected truthy, got falsy');
}

function assertFalse(val, msg) {
  if (val) throw new Error(msg || 'expected falsy, got truthy');
}

function assertInRange(val, min, max, msg) {
  if (val < min || val > max) throw new Error(msg || `expected ${val} in [${min},${max}]`);
}

// ============================================================
// Test cases
// ============================================================

describe('初始化 (init)', () => {
  it('蛇初始长度为 3', () => {
    const snake = createInitSnake();
    assertEqual(snake.length, 3, '初始蛇长度应为 3');
  });

  it('蛇头位于棋盘正中央', () => {
    const snake = createInitSnake();
    assertEqual(snake[0].x, CX, `蛇头 x 应为 ${CX}`);
    assertEqual(snake[0].y, CY, `蛇头 y 应为 ${CY}`);
  });

  it('蛇身为水平排列（头朝右）', () => {
    const snake = createInitSnake();
    assertEqual(snake[1].x, CX - 1, '第二节 x 应在头左侧 1 格');
    assertEqual(snake[2].x, CX - 2, '第三节 x 应在头左侧 2 格');
    assertEqual(snake[1].y, CY, '第二节 y 应与头相同');
    assertEqual(snake[2].y, CY, '第三节 y 应与头相同');
  });
});

describe('方向系统 (Direction)', () => {
  it('DIR 常量定义完整', () => {
    assertEqual(DIR.UP, { x: 0, y: -1 });
    assertEqual(DIR.DOWN, { x: 0, y: 1 });
    assertEqual(DIR.LEFT, { x: -1, y: 0 });
    assertEqual(DIR.RIGHT, { x: 1, y: 0 });
  });

  it('禁止 180° 反向移动（右→左）', () => {
    assertFalse(canChangeDirection(DIR.RIGHT, DIR.LEFT), '右移时不应允许左转');
  });

  it('禁止 180° 反向移动（上→下）', () => {
    assertFalse(canChangeDirection(DIR.UP, DIR.DOWN), '上移时不应允许下转');
  });

  it('允许 90° 转向（右→上）', () => {
    assertTrue(canChangeDirection(DIR.RIGHT, DIR.UP), '右移时应允许上转');
  });

  it('允许 90° 转向（下→左）', () => {
    assertTrue(canChangeDirection(DIR.DOWN, DIR.LEFT), '下移时应允许左转');
  });

  it('允许同向移动（右→右）', () => {
    assertTrue(canChangeDirection(DIR.RIGHT, DIR.RIGHT), '应允许保持同方向');
  });
});

describe('蛇移动 (Movement)', () => {
  it('向右移动 1 格', () => {
    const snake = [{ x: 10, y: 5 }, { x: 9, y: 5 }, { x: 8, y: 5 }];
    const food = { x: 99, y: 99 };  // food far away
    const result = updateSnake(snake, DIR.RIGHT, food);
    assertEqual(result.snake[0], { x: 11, y: 5 }, '蛇头应右移 1 格');
    assertEqual(result.snake[1], { x: 10, y: 5 }, '第二节跟到原蛇头位置');
    assertEqual(result.snake[2], { x: 9, y: 5 }, '第三节跟到原第二节位置');
    assertEqual(result.snake.length, 3, '长度不变');
    assertFalse(result.ate, '不应吃到食物');
  });

  it('向上移动 1 格', () => {
    const snake = [{ x: 5, y: 5 }, { x: 5, y: 6 }];
    const food = { x: 99, y: 99 };
    const result = updateSnake(snake, DIR.UP, food);
    assertEqual(result.snake[0], { x: 5, y: 4 }, '蛇头应上移');
    assertEqual(result.snake.length, 2);
  });

  it('吃到食物后蛇身增长', () => {
    const snake = [{ x: 5, y: 5 }, { x: 4, y: 5 }];
    const food = { x: 6, y: 5 };
    const result = updateSnake(snake, DIR.RIGHT, food);
    assertTrue(result.ate, '应标记为吃到食物');
    assertEqual(result.snake.length, 3, '长度应 +1');
    assertEqual(result.snake[0], { x: 6, y: 5 }, '蛇头移动到食物位置');
    assertEqual(result.snake[2], { x: 4, y: 5 }, '原尾部保留');
  });
});

describe('碰撞检测 (Collision)', () => {
  it('撞左墙', () => {
    assertTrue(checkWallCollision({ x: -1, y: 5 }), 'x < 0 应视为撞墙');
  });

  it('撞右墙', () => {
    assertTrue(checkWallCollision({ x: COLS, y: 5 }), `x >= ${COLS} 应视为撞墙`);
  });

  it('撞上墙', () => {
    assertTrue(checkWallCollision({ x: 5, y: -1 }), 'y < 0 应视为撞墙');
  });

  it('撞下墙', () => {
    assertTrue(checkWallCollision({ x: 5, y: ROWS }), `y >= ${ROWS} 应视为撞墙`);
  });

  it('有效位置不触发碰撞', () => {
    assertFalse(checkWallCollision({ x: 0, y: 0 }), '左上角应在边界内');
    assertFalse(checkWallCollision({ x: COLS - 1, y: ROWS - 1 }), '右下角应在边界内');
    assertFalse(checkWallCollision({ x: 15, y: 10 }), '中心位置应在边界内');
  });

  it('蛇头撞到自己身体', () => {
    const snake = [
      { x: 10, y: 5 },
      { x: 9, y: 5 },
      { x: 10, y: 6 },
      { x: 10, y: 5 },  // duplicate — would be the head position
    ];
    // Simulate: head moves to (10,6), but (10,6) is already in body
    assertTrue(checkSelfCollision(snake, { x: 10, y: 6 }), '应检测到自身碰撞');
  });

  it('蛇头未撞到自己', () => {
    const snake = [
      { x: 10, y: 5 }, { x: 9, y: 5 }, { x: 8, y: 5 },
      { x: 7, y: 5 }, { x: 6, y: 5 },
    ];
    assertFalse(checkSelfCollision(snake, { x: 10, y: 6 }),
      '头部移动到空位不应碰撞');
  });
});

describe('食物生成 (spawnFood)', () => {
  it('食物不在蛇身上', () => {
    const snake = createInitSnake();
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    for (let i = 0; i < 20; i++) {
      const food = spawnFood(snake);
      assertFalse(occupied.has(`${food.x},${food.y}`),
        `食物 ${food.x},${food.y} 不应在蛇身上`);
    }
  });

  it('食物在棋盘范围内', () => {
    const snake = createInitSnake();
    for (let i = 0; i < 30; i++) {
      const food = spawnFood(snake);
      assertInRange(food.x, 0, COLS - 1, `食物 x=${food.x} 越界`);
      assertInRange(food.y, 0, ROWS - 1, `食物 y=${food.y} 越界`);
    }
  });

  it('棋盘几乎满时仍能找到空位', () => {
    const snake = [];
    // Fill all but 3 cells
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        if (x === 5 && y < 3) continue;
        snake.push({ x, y });
      }
    }
    const food = spawnFood(snake);
    assertEqual(food.x, 5, '食物 x 应在唯一空列');
    assertInRange(food.y, 0, 2, '食物 y 应在预留的 3 个空位内');
  });
});

describe('蛇身渐变颜色 (Color)', () => {
  it('蛇头颜色最亮', () => {
    const color = getSnakeColor(0, 10);
    // Head should be bright green-ish
    assertTrue(color.includes('204') || color.includes('163') || color.includes('78'),
      '蛇头应有明显的颜色分量');
  });

  it('蛇身越长每段越暗', () => {
    // For same index, longer snake = darker color (smaller ratio)
    const cShort = getSnakeColor(5, 10);
    const cLong  = getSnakeColor(5, 50);
    const extractG = (c) => parseInt(c.split(',')[1]);
    assertTrue(extractG(cLong) < extractG(cShort) ||
              extractG(cLong) <= extractG(cShort),
      '更长的蛇中同位置段应更暗');
  });

  it('同一条蛇中越靠后越暗', () => {
    const cHead = getSnakeColor(0, 15);
    const cMid  = getSnakeColor(7, 15);
    const cTail = getSnakeColor(14, 15);
    const brightness = (c) => {
      const parts = c.match(/\d+/g).map(Number);
      return parts[0] + parts[1] + parts[2];
    };
    assertTrue(brightness(cHead) > brightness(cMid), '蛇头应比蛇身中部亮');
    assertTrue(brightness(cMid) > brightness(cTail), '蛇身中部应比蛇尾亮');
  });
});

describe('边界条件 (Edge Cases)', () => {
  it('最短蛇（长度 1）吃到食物', () => {
    const snake = [{ x: 5, y: 5 }];
    const food = { x: 6, y: 5 };
    const result = updateSnake(snake, DIR.RIGHT, food);
    assertEqual(result.snake.length, 2, '长度 1 → 2');
    assertTrue(result.ate);
  });

  it('紧贴墙壁但未碰撞', () => {
    assertFalse(checkWallCollision({ x: 0, y: 5 }), 'x=0 不应碰撞');
    assertFalse(checkWallCollision({ x: COLS - 1, y: 5 }), 'x=COLS-1 不应碰撞');
    assertFalse(checkWallCollision({ x: 5, y: 0 }), 'y=0 不应碰撞');
    assertFalse(checkWallCollision({ x: 5, y: ROWS - 1 }), 'y=ROWS-1 不应碰撞');
  });

  it('分数从 0 开始累加', () => {
    let score = 0;
    score += 10;
    assertEqual(score, 10);
    score += 10;
    assertEqual(score, 20);
    score += 10;
    assertEqual(score, 30);
  });

  it('蛇可占满整个棋盘', () => {
    const occupied = new Set();
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++)
        occupied.add(`${x},${y}`);
    assertEqual(occupied.size, COLS * ROWS, `应能容纳 ${COLS * ROWS} 个格子`);
  });
});

// ============================================================
// Render results
// ============================================================
const summaryEl = document.getElementById('summary');
summaryEl.innerHTML = `
  <div class="summary-card pass"><div class="num">${totalPass}</div><div class="label">通过</div></div>
  <div class="summary-card fail"><div class="num">${totalFail}</div><div class="label">失败</div></div>
  <div class="summary-card"><div class="num">${totalPass + totalFail}</div><div class="label">总计</div></div>
  <div class="summary-card"><div class="num">${suites.length}</div><div class="label">测试套件</div></div>
`;

const suitesEl = document.getElementById('suites');
suites.forEach((suite, si) => {
  const cls = suite.failed === 0 ? 'passed' : 'failed';
  const div = document.createElement('div');
  div.className = `suite ${cls}`;
  div.innerHTML = `
    <div class="suite-header" onclick="this.nextElementSibling.classList.toggle('open')">
      <span>${suite.name}</span>
      <span class="status" style="color:${suite.failed ? 'var(--fail)' : 'var(--pass)'}">
        ${suite.passed}/${suite.passed + suite.failed} 通过
      </span>
    </div>
    <div class="suite-body${si === 0 ? ' open' : ''}">
      ${suite.tests.map(t => `
        <div class="test-case ${t.status}">
          <span class="icon">${t.status === 'pass' ? '✓' : '✗'}</span>
          <span class="msg">${t.name}</span>
          ${t.error ? `<span class="detail">— ${t.error}</span>` : ''}
        </div>
      `).join('')}
    </div>
  `;
  suitesEl.appendChild(div);
});
</script>
</body>
</html>
